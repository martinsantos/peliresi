<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas, size) {
    const ctx = canvas.getContext('2d');
    ctx.scale(size / 64, size / 64);
    ctx.fillStyle = '#1B5E3C';
    ctx.beginPath();
    ctx.roundRect(0, 0, 64, 64, 14);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke(new Path2D('M 50 11 C 34 13 19 15 14 29 C 9 42 16 53 29 53 C 45 53 54 36 50 11 Z'));
    ctx.stroke(new Path2D('M 15 45 L 26 34 L 35 39 L 47 24'));
    ctx.fillStyle = '#fff';
    for (const [x, y] of [[26, 34], [35, 39], [47, 24]]) {
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
}
drawIcon(document.getElementById('c192'), 192);
drawIcon(document.getElementById('c512'), 512);
// Convert to data URLs and show
console.log('192:', document.getElementById('c192').toDataURL());
console.log('512:', document.getElementById('c512').toDataURL());
</script>
</body>
</html>
