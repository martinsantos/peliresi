name: SITREP reviewed Hostinger publication
on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-publication.yml'
      - '.github/workflows/deploy-production.yml'
      - 'scripts/cicd/hostinger/**'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preflight, prepare, publish]
        default: preflight
        description: Preflight only reads the current runtime; prepare stages; publish activates an exact reviewed bundle
      release_commit:
        type: string
        required: false
        description: Full reviewed application commit already integrated into main; no default candidate
      expected_active_revision:
        type: string
        required: true
        default: 3245f36573a6b18a74d26887cdaa34e453d19d9e
        description: Exact runtime identity; initial mixed baseline is web/app 3245f365 and backend/manual 6bc08a7c
      database_migrations:
        type: string
        default: ''
        description: Prepare only; explicitly enter 20261103160000_inspection_management_role for the reviewed additive schema change
      dependency_update:
        type: string
        default: ''
        description: Prepare only; runtime-20261104 selects the exact reviewed private dependency transition from PR 44
      bundle_sha256:
        type: string
        default: ''
        description: Exact successful preparation bundle SHA-256, required to publish
      acknowledgement:
        type: string
        default: ''
        description: Use the exact requiredAcknowledgement in the receipt; schema plus private dependencies requires SITREP-HOSTINGER-SCHEMA-DEPS
permissions:
  contents: read
concurrency:
  group: sitrep-hostinger-publication
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  verify-publisher:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - name: Verify legacy retirement, package boundaries, compatibility and rollback
        run: node --experimental-strip-types --test scripts/cicd/hostinger/publisher.test.ts
      - name: Compile the reviewed TypeScript controller without installing a server toolchain
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {stripTypeScriptTypes} from 'node:module';
          fs.writeFileSync(process.env.RUNNER_TEMP+'/publisher.mjs',stripTypeScriptTypes(fs.readFileSync('scripts/cicd/hostinger/publisher.ts','utf8'),{mode:'strip'}));
          JS
          node --check "$RUNNER_TEMP/publisher.mjs"
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.6'
      - name: Parse the compiled JavaScript with the production Node version
        run: node --check "$RUNNER_TEMP/publisher.mjs"
  manual-release:
    needs: verify-publisher
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      OPERATION: ${{ inputs.operation }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      EXPECTED_ACTIVE: ${{ inputs.expected_active_revision }}
      REVIEWED_BUNDLE: ${{ inputs.bundle_sha256 }}
      DEPENDENCY_UPDATE: ${{ inputs.dependency_update }}
      DATABASE_MIGRATIONS: ${{ inputs.database_migrations }}
      ACKNOWLEDGEMENT: ${{ inputs.acknowledgement }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: publisher
          persist-credentials: false
      - name: Require explicit immutable release identities
        run: |
          set -euo pipefail
          [[ "$OPERATION" == preflight || "$OPERATION" == prepare || "$OPERATION" == publish ]]
          [[ "$EXPECTED_ACTIVE" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$OPERATION" == preflight ]]; then
            [[ -z "$RELEASE_COMMIT" && -z "$REVIEWED_BUNDLE" && -z "$ACKNOWLEDGEMENT" && -z "$DATABASE_MIGRATIONS" && -z "$DEPENDENCY_UPDATE" ]]
          else
            [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          fi
          if [[ "$OPERATION" == publish ]]; then
            [[ "$ACKNOWLEDGEMENT" == SITREP-HOSTINGER || "$ACKNOWLEDGEMENT" == SITREP-HOSTINGER-SCHEMA || "$ACKNOWLEDGEMENT" == SITREP-HOSTINGER-DEPS || "$ACKNOWLEDGEMENT" == SITREP-HOSTINGER-SCHEMA-DEPS ]]
            [[ "$REVIEWED_BUNDLE" =~ ^[0-9a-f]{64}$ && -z "$DATABASE_MIGRATIONS" && -z "$DEPENDENCY_UPDATE" ]]
          fi
          if [[ "$OPERATION" == prepare ]]; then
            [[ -z "$ACKNOWLEDGEMENT" && -z "$REVIEWED_BUNDLE" ]]
            [[ -z "$DATABASE_MIGRATIONS" || "$DATABASE_MIGRATIONS" == 20261103160000_inspection_management_role ]]
            [[ -z "$DEPENDENCY_UPDATE" || "$DEPENDENCY_UPDATE" == runtime-20261104 ]]
          fi
      - uses: actions/checkout@v6
        if: inputs.operation == 'prepare'
        with:
          ref: ${{ inputs.release_commit }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed candidate in main, never the local refactor checkout
        if: inputs.operation == 'prepare'
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse HEAD)" = "$RELEASE_COMMIT" ]]
          git -C candidate merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          git -C candidate merge-base --is-ancestor c8402190edfc36b5e5d0dee1337c24bd1689420d "$RELEASE_COMMIT"
      - uses: actions/setup-node@v6
        if: inputs.operation == 'prepare'
        with:
          node-version: '20.19.6'
      - name: Install PDF verification tools in the isolated preparation runner
        if: inputs.operation == 'prepare'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v pdftotext
          command -v pdfinfo
          command -v pdftoppm
      - name: Build and test only the explicitly reviewed application in isolated CI
        if: inputs.operation == 'prepare'
        env:
          DATABASE_URL: postgresql://ci:isolated-fixture@127.0.0.1:1/sitrep_ci
          NODE_ENV: test
          DISABLE_EMAILS: 'true'
          BLOCKCHAIN_ENABLED: 'false'
          PUSH_MANIFEST_NOTICES_ENABLED: 'false'
          VITE_API_URL: https://sitrep.ultimamilla.com.ar/api
          VITE_PUBLIC_DEMO_MODE: 'false'
          VITE_DEMO_LOGIN_ENABLED: 'false'
        run: |
          set -euo pipefail
          cd candidate/backend
          npm ci
          npm audit --omit=dev --audit-level=high
          npx --no-install prisma generate --schema prisma/schema.prisma
          npm test -- --maxWorkers=1
          npm run build
          cd ../frontend
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run lint:critical
          VITE_API_URL=/api npm test -- --maxWorkers=1
          npm run build
          npx vite build --config vite.config.app.ts
      - name: Prune candidate-only dependencies after tests, never on the server
        if: inputs.operation == 'prepare' && inputs.dependency_update != ''
        run: |
          set -euo pipefail
          cd candidate/backend
          before=$(sha256sum package.json package-lock.json)
          cp -R node_modules/.prisma "$RUNNER_TEMP/candidate-prisma"
          npm prune --omit=dev --ignore-scripts
          # Preserve any pruned copy and restore only the generated client tested above.
          if [[ -e node_modules/.prisma ]]; then mv node_modules/.prisma "$RUNNER_TEMP/pruned-prisma-retained"; fi
          cp -R "$RUNNER_TEMP/candidate-prisma" node_modules/.prisma
          [[ "$before" = "$(sha256sum package.json package-lock.json)" ]]
          npm ls --omit=dev --all > "$RUNNER_TEMP/runtime-dependency-tree.txt"
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - name: Compile trusted controller and freeze the tested package
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {stripTypeScriptTypes} from 'node:module';
          fs.writeFileSync(process.env.RUNNER_TEMP+'/publisher.mjs',stripTypeScriptTypes(fs.readFileSync('publisher/scripts/cicd/hostinger/publisher.ts','utf8'),{mode:'strip'}));
          JS
          node --check "$RUNNER_TEMP/publisher.mjs"
          if [[ "$OPERATION" == prepare ]]; then
            node --experimental-strip-types publisher/scripts/cicd/hostinger/package.ts "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/bundle" "$RELEASE_COMMIT" "$DATABASE_MIGRATIONS" "$DEPENDENCY_UPDATE"
            echo "BUNDLE_SHA=$(sha256sum "$RUNNER_TEMP/bundle/release.tar.gz" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          elif [[ "$OPERATION" == publish ]]; then
            echo "BUNDLE_SHA=$REVIEWED_BUNDLE" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v6
        if: inputs.operation == 'prepare' && inputs.dependency_update != ''
        with:
          node-version: '20.19.6'
      - name: Smoke sealed candidate modules without database, SMTP or push
        if: inputs.operation == 'prepare' && inputs.dependency_update != ''
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {createRequire} from 'node:module';
          if(process.version!=='v20.19.6' || process.platform!=='linux' || process.arch!=='x64')throw new Error('Unexpected runtime toolchain');
          const backend=process.env.RUNNER_TEMP+'/bundle/tree/backend';
          const root=backend+'/runtime-dependencies';
          const require=createRequire(root+'/runtime-smoke.cjs');
          const pkg=JSON.parse(fs.readFileSync(backend+'/package.json','utf8'));
          for(const name of Object.keys(pkg.dependencies)) {
            if(!fs.realpathSync(require.resolve(name)).startsWith(root+path.sep))throw new Error('Dependency escaped candidate');
            require(name);
          }
          const {Prisma}=require('@prisma/client');
          if(!Prisma.dmmf.datamodel.models.some(m=>m.name==='InspectionStaffRole'))throw new Error('Wrong generated Prisma client');
          await require('sharp')({create:{width:1,height:1,channels:3,background:'#ffffff'}}).png().toBuffer();
          const mail=await require('nodemailer').createTransport({streamTransport:true,buffer:true}).sendMail({from:'fixture@example.invalid',to:'fixture@example.invalid',subject:'Offline runtime check',text:'Not sent'});
          if(!Buffer.isBuffer(mail.message))throw new Error('Offline mail rendering failed');
          console.log('Private runtime smoke passed: all direct imports, Prisma model, native image, offline mail');
          JS
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Execute only the reviewed operation on the pinned Hostinger host
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' '179.198.115.115 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILxeE+c4eB1EKzsGySW+ARG8T8F9pyvp8iEjj9cBRuaX' > "$RUNNER_TEMP/hostinger-known-hosts"
          opts=(-o BatchMode=yes -o ForwardAgent=no -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/hostinger-known-hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30)
          target=root@179.198.115.115
          if [[ "$OPERATION" == preflight ]]; then
            ssh "${opts[@]}" "$target" "/usr/bin/node --input-type=module - preflight $EXPECTED_ACTIVE" < "$RUNNER_TEMP/publisher.mjs"
            exit 0
          fi
          [[ "$BUNDLE_SHA" =~ ^[0-9a-f]{64}$ ]]
          root=/srv/umsa-sitrep-publisher
          incoming="$root/incoming/$id"
          ssh "${opts[@]}" "$target" "test \"\$(hostname)\" = srv2101069.hstgr.cloud && test \"\$(cat /srv/umsa-migration/.target)\" = 179.198.115.115 && test -f /srv/umsa-migration/production.active && test ! -L $root && test ! -e $incoming && install -d -m 0755 $root $root/releases && install -d -m 0700 $root/incoming $root/staged $root/backups $incoming"
          scp "${opts[@]}" "$RUNNER_TEMP/publisher.mjs" "$target:$incoming/publisher.mjs"
          local_hash=$(sha256sum "$RUNNER_TEMP/publisher.mjs" | cut -d ' ' -f1)
          remote_hash=$(ssh "${opts[@]}" "$target" "sha256sum $incoming/publisher.mjs" | cut -d ' ' -f1)
          [[ "$local_hash" = "$remote_hash" ]]
          if [[ "$OPERATION" == prepare ]]; then
            scp "${opts[@]}" "$RUNNER_TEMP/bundle/release.tar.gz" "$RUNNER_TEMP/bundle/release.json" "$target:$incoming/"
          fi
          ssh "${opts[@]}" "$target" "flock --nonblock /run/lock/umsa-sitrep-publisher.lock /usr/bin/node $incoming/publisher.mjs $OPERATION $RELEASE_COMMIT $EXPECTED_ACTIVE $BUNDLE_SHA $id $ACKNOWLEDGEMENT"
