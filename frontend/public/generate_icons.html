<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
// The generator consumes the canonical vector instead of keeping another drawing.
const mark = new Image();
mark.onload = () => {
    for (const size of [192, 512]) {
        const canvas = document.getElementById('c' + size);
        canvas.getContext('2d').drawImage(mark, 0, 0, size, size);
        console.log(size + ':', canvas.toDataURL());
    }
};
mark.onerror = () => { document.body.append('No se pudo cargar la marca de SITREP.'); };
mark.src = './favicon.svg';
</script>
</body>
</html>
