<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1B5E3C"><link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>SITREP · Sin conexión</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f7f9fa;color:#172c24;font:16px/1.6 system-ui,-apple-system,sans-serif}main{width:100%;max-width:460px;padding:32px 24px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:36px;color:#1b5e3c;font-size:24px;font-weight:750}.brand img{width:40px;height:40px}h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:0 0 16px}p{color:#526359;margin:0 0 20px}button{width:100%;min-height:48px;padding:12px 20px;border:0;border-radius:8px;background:#1b5e3c;color:#fff;font:600 16px/1.5 system-ui;cursor:pointer}button:hover{background:#154a30}button:focus-visible{outline:3px solid #1b5e3c;outline-offset:4px}.note{margin-top:24px;padding-top:20px;border-top:1px solid #dce5df;font-size:14px}
</style>

<body><main>
<div class="brand"><img src="./favicon.svg" alt=""><span data-sitrep-wordmark>SITREP</span></div>
<h1>No hay conexión</h1>
<p>No pudimos abrir esta pantalla. Revisá tu conexión y volvé a intentar.</p>
<button type="button" onclick="window.location.reload()">Reintentar conexión</button>
<p class="note">Si tenías cambios pendientes, conservá este navegador y revisá su estado al volver. Un cambio está confirmado cuando SITREP indica que se guardó.</p>
</main><script>window.addEventListener('online',()=>window.location.reload(),{once:true});</script></body></html>
