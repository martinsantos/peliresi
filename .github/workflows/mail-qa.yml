name: SITREP Mail Safety QA
on:
  push:
    branches: [codex/sitrep-mail-safety-20261011]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sitrep-mail-safety-qa
  cancel-in-progress: false
jobs:
  isolated-mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: postgresql://qa@127.0.0.1:55440/sitrep_night_qa_20260926
      DISABLE_EMAILS: 'true'
      EMAIL_DELIVERY_NOT_BEFORE: ''
      BLOCKCHAIN_ENABLED: 'false'
      SMTP_HOST: '127.0.0.1'
      SMTP_USER: ''
      SMTP_PASS: ''
      VAPID_PUBLIC_KEY: ''
      VAPID_PRIVATE_KEY: ''
      FRONTEND_URL: http://127.0.0.1:4177
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked dependencies in cloud only
        run: npm ci --prefix backend --no-audit --no-fund
      - name: Generate types, no database connection or server
        working-directory: backend
        run: npx --no-install prisma generate
      - name: All backend units, one worker, providers mocked
        id: units
        continue-on-error: true
        working-directory: backend
        run: npm test -- --maxWorkers=1 --reporter=json --outputFile=/tmp/sitrep-mail-unit.json
      - name: Backend type check
        working-directory: backend
        run: npx --no-install tsc --noEmit -p tsconfig.build.json
      - name: Require units
        if: always()
        run: test '${{ steps.units.outcome }}' = success
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sitrep-mail-qa-${{ github.run_id }}
          path: /tmp/sitrep-mail-*.json
          retention-days: 3
          if-no-files-found: error
